# /etc/nginx/sites-available/docswitch
limit_req_zone $binary_remote_addr zone=docswitch:10m rate=30r/m;

# Port dédié : le VPS héberge déjà d'autres sites sur 443. Une connexion vers une IP
# n'envoie pas de SNI, donc sur 443 Nginx présenterait le certificat d'un autre site
# et l'app (qui n'accepte que server.crt) refuserait la connexion.
server {
    listen 8445 ssl;
    listen [::]:8445 ssl;
    server_name 185.215.165.43;

    ssl_certificate     /etc/nginx/docswitch/server.crt;
    ssl_certificate_key /etc/nginx/docswitch/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    # 50 Mo de fichier + l'enveloppe multipart
    client_max_body_size 51m;
    client_body_timeout 120s;
    # Le corps est transmis à l'API au fil de l'eau, sans copie sur le disque du VPS.
    proxy_request_buffering off;
    proxy_buffering off;

    # Erreurs Nginx au même format JSON que l'API
    error_page 413 = @too_large;
    location @too_large {
        default_type application/json;
        return 413 '{"code":"FILE_TOO_LARGE","message":"Le fichier dépasse la taille maximale de 50 Mo."}';
    }
    error_page 502 503 504 = @unavailable;
    location @unavailable {
        default_type application/json;
        return 503 '{"code":"CONVERSION_FAILED","message":"Le service est momentanément indisponible."}';
    }

    access_log off;

    location / {
        limit_req zone=docswitch burst=10 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 150s;
        proxy_send_timeout 150s;
    }
}
