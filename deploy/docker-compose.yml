services:
  api:
    build: ../backend
    image: docswitch-api
    container_name: docswitch-api
    restart: unless-stopped
    env_file: .env
    # Uniquement accessible depuis le VPS lui-même : Nginx fait le HTTPS devant.
    ports:
      - "127.0.0.1:8000:8000"
    # Fichiers temporaires en RAM : rien n'est jamais écrit sur le disque du VPS.
    tmpfs:
      - /tmp:size=1g,mode=1777
    read_only: true
    security_opt:
      - no-new-privileges:true
    mem_limit: 2g
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
